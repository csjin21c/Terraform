name: "Terraform CI/CD"

on:
  push:
    branches: ["main"] # main 브랜치에 푸시될 때 동작
  pull_request:
    branches: ["main"]

jobs:
  terraform:
    name: "Terraform Deploy"
    runs-on: ubuntu-latest

    # 워크플로우가 실행될 디렉토리를 working-directory: 디렉토리명
    defaults:
      run:
        working-directory: create-vpc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0 # 사용할 테라폼 버전 지정

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        env:
          TF_SKIN_PROVIDER_VERIFY: "1"
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      # main 브랜치에 직접 푸시(Merge)될 때만 실제로 인프라에 적용(Apply)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
